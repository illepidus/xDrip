name: Create release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_KEY_ALIAS: diasync

concurrency:
  group: diasync-xdrip-create-release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          major="$(sed -n 's/^diasyncReleaseMajor=//p' gradle.properties)"
          if [[ ! "$major" =~ ^(0|[1-9][0-9]*)$ ]] || (( major > 4968 )); then
            echo "diasyncReleaseMajor must be an integer between 0 and 4968" >&2
            exit 1
          fi

          latest_minor=-1
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v${major}\.([0-9]+)$ ]]; then
              candidate="${BASH_REMATCH[1]}"
              if (( candidate > latest_minor )); then
                latest_minor="$candidate"
              fi
            fi
          done < <(git tag --list "v${major}.*")

          minor=$((latest_minor + 1))
          if (( minor > 99999 )); then
            echo "Minor version exceeds the supported Android versionCode range" >&2
            exit 1
          fi
          version_code=$((1603091401 + major * 100000 + minor))

          version="${major}.${minor}"
          branch="diasync-xdrip-release-${version}"
          tag="v${version}"

          if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
            echo "Release branch ${branch} already exists" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "Release tag ${tag} already exists" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        id: branch
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          git branch "$RELEASE_BRANCH" "$GITHUB_SHA"
          git push origin "$RELEASE_BRANCH"
          git switch "$RELEASE_BRANCH"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: ./gradlew testProdReleaseUnitTest

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "All Android signing settings must be configured" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/diasync-release.jks"

      - name: Build release APKs
        env:
          DIASYNC_VERSION_NAME: ${{ steps.version.outputs.version }}
          DIASYNC_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          DIASYNC_KEYSTORE_PATH: ${{ runner.temp }}/diasync-release.jks
          DIASYNC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DIASYNC_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          DIASYNC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache :app:assembleProdRelease :wear:assembleProdRelease

      - name: Collect release APKs
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-artifacts
          cp app/build/outputs/apk/prod/release/app-prod-release.apk "release-artifacts/diasync-xdrip-app-release-${RELEASE_VERSION}.apk"
          cp wear/build/outputs/apk/prod/release/wear-prod-release.apk "release-artifacts/diasync-xdrip-wear-release-${RELEASE_VERSION}.apk"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/*.apk \
            --target "$RELEASE_BRANCH" \
            --title "Diasync xDrip ${RELEASE_VERSION}" \
            --generate-notes

      - name: Delete failed release branch
        if: ${{ failure() && steps.branch.outputs.created == 'true' }}
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
        run: git push origin --delete "$RELEASE_BRANCH"
