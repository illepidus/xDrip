def signingEnvironment = [
        storeFile    : System.getenv('DIASYNC_KEYSTORE_PATH'),
        storePassword: System.getenv('DIASYNC_KEYSTORE_PASSWORD'),
        keyAlias     : System.getenv('DIASYNC_KEY_ALIAS'),
        keyPassword  : System.getenv('DIASYNC_KEY_PASSWORD')
]

def suppliedValues = signingEnvironment.values().count { it != null && !it.isBlank() }
if (suppliedValues != 0 && suppliedValues != signingEnvironment.size()) {
    throw new GradleException('Release signing environment is incomplete')
}

if (suppliedValues == signingEnvironment.size()) {
    android {
        signingConfigs {
            release {
                storeFile file(signingEnvironment.storeFile)
                storePassword signingEnvironment.storePassword
                keyAlias signingEnvironment.keyAlias
                keyPassword signingEnvironment.keyPassword
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }
}
